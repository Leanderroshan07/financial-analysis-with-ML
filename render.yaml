services:
  - type: web
    name: moneyyy-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: node dist/server.js
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: https://moneyyy.vercel.app
      - key: AI_SERVICE_URL
        value: https://financial-analysis-with-ml.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: moneyyy-db
          property: connectionString

databases:
  - name: moneyyy-db
    plan: free
    databaseName: moneyyy
    user: moneyyy